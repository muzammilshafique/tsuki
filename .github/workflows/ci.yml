name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    container:
      image: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Arch Linux
            distro: arch
            image: archlinux:base-devel
          - name: Debian / Ubuntu (.deb base)
            distro: debian
            image: debian:trixie
          - name: Fedora
            distro: fedora
            image: fedora:latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Arch Linux build dependencies
        if: matrix.distro == 'arch'
        run: |
          sed -i 's/^#DisableSandbox/DisableSandbox/' /etc/pacman.conf
          pacman -Sy --noconfirm archlinux-keyring
          pacman -Syu --noconfirm \
            git cmake ninja pkgconf \
            qt6-base qt6-declarative qt6-svg sdl2 zlib \
            hicolor-icon-theme tar \
            desktop-file-utils appstream

      - name: Install Debian / Ubuntu build dependencies
        if: matrix.distro == 'debian'
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates git cmake ninja-build pkg-config g++ \
            qt6-base-dev qt6-declarative-dev qt6-svg-dev \
            qt6-qpa-plugins qt6-svg-plugins libqt6sql6-sqlite \
            qml6-module-qtquick qml6-module-qtquick-controls \
            qml6-module-qtquick-layouts qml6-module-qtquick-effects \
            libsdl2-dev zlib1g-dev libgl-dev hicolor-icon-theme tar

      - name: Install Fedora build dependencies
        if: matrix.distro == 'fedora'
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            git cmake ninja-build gcc-c++ pkgconf-pkg-config \
            qt6-qtbase-devel qt6-qtdeclarative-devel qt6-qtsvg-devel \
            'pkgconfig(sdl2)' 'pkgconfig(zlib)' \
            hicolor-icon-theme tar

      - name: Validate desktop and AppStream metadata
        if: matrix.distro == 'arch'
        run: |
          desktop-file-validate packaging/desktop/io.github.muzammilshafique.tsuki.desktop
          appstreamcli validate --no-net packaging/metainfo/io.github.muzammilshafique.tsuki.metainfo.xml

      - name: Configure CMake
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DCMAKE_INSTALL_LIBDIR=lib

      - name: Build Tsuki and Test Suite
        run: cmake --build build

      - name: Run Unit Tests & Engine Smoke Test
        run: |
          TEST_HOME="$(mktemp -d)"
          trap 'rm -rf "${TEST_HOME}"' EXIT
          mkdir -p "${TEST_HOME}/.config" "${TEST_HOME}/.local/share" "${TEST_HOME}/.cache"
          export HOME="${TEST_HOME}"
          export XDG_CONFIG_HOME="${TEST_HOME}/.config"
          export XDG_DATA_HOME="${TEST_HOME}/.local/share"
          export XDG_CACHE_HOME="${TEST_HOME}/.cache"
          export QT_QPA_PLATFORM=offscreen
          ctest --test-dir build --output-on-failure
          ./build/tsuki --smoke-test
