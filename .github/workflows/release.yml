name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to test build (e.g. v0.1.1; GitHub Release is only published on tag push)'
        required: false
        default: 'v0.1.1'

permissions:
  contents: write

jobs:
  package-arch:
    name: Package Arch Linux (.pkg.tar.zst)
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    outputs:
      tag: ${{ steps.vars.outputs.tag }}
      raw_version: ${{ steps.vars.outputs.raw_version }}
      pkgver: ${{ steps.vars.outputs.pkgver }}
      upstream_pkgrel: ${{ steps.vars.outputs.upstream_pkgrel }}
      git_pkgver: ${{ steps.vars.outputs.git_pkgver }}
    steps:
      - name: Prepare Arch container and install packaging dependencies
        run: |
          sed -i 's/^#DisableSandbox/DisableSandbox/' /etc/pacman.conf
          pacman -Sy --noconfirm archlinux-keyring
          pacman -Syu --noconfirm \
            sudo git cmake ninja pkgconf \
            qt6-base qt6-declarative qt6-svg sdl2 zlib \
            hicolor-icon-theme tar zstd \
            desktop-file-utils appstream
          # Host workspace is bind-mounted as the runner user (UID 1001), while container steps run as root/builduser
          git config --system --add safe.directory '*'

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Determine Version
        id: vars
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="${{ github.event.inputs.tag || 'v0.1.1' }}"
          fi
          RAW_VERSION="${TAG#v}"
          PKGVER="${RAW_VERSION//-/.}"
          UPSTREAM_PKGREL="$(grep '^pkgrel=' packaging/arch/PKGBUILD | head -n 1 | cut -d= -f2)"
          UPSTREAM_PKGREL="${UPSTREAM_PKGREL:-1}"
          GIT_PKGVER="$(git describe --long --abbrev=7 --tags --match "${TAG}" 2>/dev/null | sed 's/^v//;s/\([^-]*-g\)/r\1/;s/-/./g' || true)"
          if [[ -z "${GIT_PKGVER}" ]]; then
            GIT_PKGVER="${PKGVER}.r0.g$(git rev-parse --short=7 HEAD)"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "raw_version=${RAW_VERSION}" >> "$GITHUB_OUTPUT"
          echo "pkgver=${PKGVER}" >> "$GITHUB_OUTPUT"
          echo "upstream_pkgrel=${UPSTREAM_PKGREL}" >> "$GITHUB_OUTPUT"
          echo "git_pkgver=${GIT_PKGVER}" >> "$GITHUB_OUTPUT"

      - name: Validate desktop and AppStream metadata
        run: |
          desktop-file-validate packaging/desktop/io.github.muzammilshafique.tsuki.desktop
          appstreamcli validate --no-net packaging/metainfo/io.github.muzammilshafique.tsuki.metainfo.xml

      - name: Setup Non-Root Build User
        run: |
          useradd -m -s /bin/bash builduser
          echo "builduser ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          chown -R builduser:builduser "${GITHUB_WORKSPACE}"

      - name: Build Arch Linux Package
        run: |
          su builduser -c "
            export HOME=/home/builduser
            export VERSION='${{ steps.vars.outputs.raw_version }}'
            export MAKEPKG_FLAGS='-sf --noconfirm'
            cd '${GITHUB_WORKSPACE}'
            ./packaging/arch/build-arch.sh '${GITHUB_WORKSPACE}/dist'
          "

      - name: Verify Arch Package & Test Install/Uninstall
        run: |
          PKG_FILE=$(find dist -maxdepth 1 -name "*.pkg.tar.zst" ! -name "*-debug-*" | head -n 1)
          test -n "${PKG_FILE}"
          echo "Inspecting Arch package: ${PKG_FILE}"
          pacman -Qip "${PKG_FILE}"
          pacman -Qlp "${PKG_FILE}"

          pacman -U --noconfirm "${PKG_FILE}"
          QT_QPA_PLATFORM=offscreen tsuki --version
          QT_QPA_PLATFORM=offscreen tsuki --help
          QT_QPA_PLATFORM=offscreen tsuki --smoke-test

          test -f /usr/share/applications/io.github.muzammilshafique.tsuki.desktop
          test -f /usr/share/metainfo/io.github.muzammilshafique.tsuki.metainfo.xml
          test -f /usr/share/icons/hicolor/scalable/apps/io.github.muzammilshafique.tsuki.svg
          test -f /usr/lib/udev/rules.d/70-tsuki-uinput.rules
          test -f /usr/lib/modules-load.d/tsuki-uinput.conf
          test -f /usr/share/licenses/tsuki/LICENSE

          pacman -R --noconfirm tsuki
          hash -r
          if [[ -e /usr/bin/tsuki ]] || command -v tsuki >/dev/null 2>&1; then
            echo "Error: tsuki binary still exists after package removal!" >&2
            exit 1
          fi

      - name: Generate & Verify AUR tsuki-bin Package Files
        run: |
          PKG_FILE=$(find dist -maxdepth 1 -name "*.pkg.tar.zst" ! -name "*-debug-*" | head -n 1)
          PKG_BASENAME=$(basename "${PKG_FILE}")
          PKG_SHA256=$(sha256sum "${PKG_FILE}" | awk '{print $1}')

          mkdir -p aur-tsuki-bin
          cp packaging/aur/tsuki-bin/{PKGBUILD,tsuki.install} aur-tsuki-bin/

          sed -i "s|^pkgver=.*|pkgver=${{ steps.vars.outputs.pkgver }}|" aur-tsuki-bin/PKGBUILD
          sed -i "s|^_tag=.*|_tag=\"${{ steps.vars.outputs.tag }}\"|" aur-tsuki-bin/PKGBUILD
          sed -i "s|^_upstream_pkgrel=.*|_upstream_pkgrel=${{ steps.vars.outputs.upstream_pkgrel }}|" aur-tsuki-bin/PKGBUILD
          sed -i "s|^pkgrel=.*|pkgrel=1|" aur-tsuki-bin/PKGBUILD
          sed -i "s|^sha256sums_x86_64=.*|sha256sums_x86_64=('${PKG_SHA256}')|" aur-tsuki-bin/PKGBUILD

          bash -n aur-tsuki-bin/PKGBUILD

          chown -R builduser:builduser aur-tsuki-bin
          su builduser -c "
            export HOME=/home/builduser
            cd '${GITHUB_WORKSPACE}/aur-tsuki-bin'
            makepkg --printsrcinfo > .SRCINFO
            cp '${GITHUB_WORKSPACE}/${PKG_FILE}' '${PKG_BASENAME}'
            makepkg -f
          "

          BIN_PKG=$(find aur-tsuki-bin -maxdepth 1 -name "tsuki-bin-*.pkg.tar.zst" ! -name "*-debug-*" | head -n 1)
          test -n "${BIN_PKG}"
          pacman -Qip "${BIN_PKG}"
          pacman -Qlp "${BIN_PKG}"

          rm -f aur-tsuki-bin/*.pkg.tar.zst

      - name: Generate & Verify AUR tsuki-git Package Files
        run: |
          mkdir -p aur-tsuki-git
          cp packaging/aur/tsuki-git/{PKGBUILD,tsuki.install} aur-tsuki-git/

          sed -i "s|^pkgver=.*|pkgver=${{ steps.vars.outputs.git_pkgver }}|" aur-tsuki-git/PKGBUILD
          sed -i "s|^pkgrel=.*|pkgrel=1|" aur-tsuki-git/PKGBUILD

          bash -n aur-tsuki-git/PKGBUILD

          chown -R builduser:builduser aur-tsuki-git
          su builduser -c "
            export HOME=/home/builduser
            cd '${GITHUB_WORKSPACE}/aur-tsuki-git'
            makepkg --printsrcinfo > .SRCINFO
          "

          grep -qxF "pkgbase = tsuki-git" aur-tsuki-git/.SRCINFO
          grep -qxF $'\tpkgver = '"${{ steps.vars.outputs.git_pkgver }}" aur-tsuki-git/.SRCINFO

      - name: Upload Arch Package
        uses: actions/upload-artifact@v7
        with:
          name: arch-package
          path: dist/*.pkg.tar.zst
          if-no-files-found: error

      - name: Upload Updated AUR tsuki-bin Files
        uses: actions/upload-artifact@v7
        with:
          name: aur-tsuki-bin
          path: |
            aur-tsuki-bin/PKGBUILD
            aur-tsuki-bin/.SRCINFO
            aur-tsuki-bin/tsuki.install
          include-hidden-files: true
          if-no-files-found: error

      - name: Upload Updated AUR tsuki-git Files
        uses: actions/upload-artifact@v7
        with:
          name: aur-tsuki-git
          path: |
            aur-tsuki-git/PKGBUILD
            aur-tsuki-git/.SRCINFO
            aur-tsuki-git/tsuki.install
          include-hidden-files: true
          if-no-files-found: error

  package-deb:
    name: Package Debian / Ubuntu (.deb)
    runs-on: ubuntu-latest
    container:
      image: debian:trixie
    steps:
      - name: Prepare Debian container and install packaging dependencies
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates git cmake ninja-build pkg-config g++ \
            dpkg-dev binutils file \
            qt6-base-dev qt6-declarative-dev qt6-svg-dev \
            qt6-qpa-plugins qt6-svg-plugins libqt6sql6-sqlite \
            qml6-module-qtquick qml6-module-qtquick-controls \
            qml6-module-qtquick-layouts qml6-module-qtquick-effects \
            libsdl2-dev zlib1g-dev libgl-dev hicolor-icon-theme tar
          git config --system --add safe.directory '*'

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Determine Version
        id: vars
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="${{ github.event.inputs.tag || 'v0.1.1' }}"
          fi
          RAW_VERSION="${TAG#v}"
          echo "raw_version=${RAW_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build Debian / Ubuntu Package
        env:
          VERSION: ${{ steps.vars.outputs.raw_version }}
        run: ./packaging/debian/build-deb.sh "${GITHUB_WORKSPACE}/dist"

      - name: Verify Debian Package & Test Install/Uninstall
        run: |
          DEB_FILE=$(find dist -maxdepth 1 -name "*.deb" | head -n 1)
          test -n "${DEB_FILE}"
          echo "Inspecting Debian package: ${DEB_FILE}"
          dpkg-deb -I "${DEB_FILE}"
          dpkg-deb -c "${DEB_FILE}"

          export DEBIAN_FRONTEND=noninteractive
          apt-get install -y "./${DEB_FILE}"
          QT_QPA_PLATFORM=offscreen tsuki --version
          QT_QPA_PLATFORM=offscreen tsuki --help
          QT_QPA_PLATFORM=offscreen tsuki --smoke-test

          test -f /usr/share/applications/io.github.muzammilshafique.tsuki.desktop
          test -f /usr/share/metainfo/io.github.muzammilshafique.tsuki.metainfo.xml
          test -f /usr/share/icons/hicolor/scalable/apps/io.github.muzammilshafique.tsuki.svg
          test -f /usr/lib/udev/rules.d/70-tsuki-uinput.rules
          test -f /usr/lib/modules-load.d/tsuki-uinput.conf
          test -f /usr/share/doc/tsuki/copyright

          apt-get purge -y tsuki
          hash -r
          if [[ -e /usr/bin/tsuki ]] || command -v tsuki >/dev/null 2>&1; then
            echo "Error: tsuki binary still exists after package removal!" >&2
            exit 1
          fi

      - name: Upload Debian / Ubuntu Package
        uses: actions/upload-artifact@v7
        with:
          name: deb-package
          path: dist/*.deb
          if-no-files-found: error

  package-rpm:
    name: Package Fedora (.rpm)
    runs-on: ubuntu-latest
    container:
      image: fedora:latest
    steps:
      - name: Prepare Fedora container and install packaging dependencies
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            git cmake ninja-build gcc-c++ pkgconf-pkg-config \
            rpm-build tar \
            qt6-qtbase-devel qt6-qtdeclarative-devel qt6-qtsvg-devel \
            'pkgconfig(sdl2)' 'pkgconfig(zlib)' \
            hicolor-icon-theme
          git config --system --add safe.directory '*'

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Determine Version
        id: vars
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="${{ github.event.inputs.tag || 'v0.1.1' }}"
          fi
          RAW_VERSION="${TAG#v}"
          echo "raw_version=${RAW_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build Fedora RPM Package
        env:
          VERSION: ${{ steps.vars.outputs.raw_version }}
        run: ./packaging/fedora/build-rpm.sh "${GITHUB_WORKSPACE}/dist"

      - name: Verify Fedora RPM Package & Test Install/Uninstall
        run: |
          RPM_FILE=$(find dist -maxdepth 1 -name "*.rpm" | head -n 1)
          test -n "${RPM_FILE}"
          echo "Inspecting Fedora RPM package: ${RPM_FILE}"
          rpm -qip "${RPM_FILE}"
          rpm -qlp "${RPM_FILE}"

          dnf install -y "./${RPM_FILE}"
          QT_QPA_PLATFORM=offscreen tsuki --version
          QT_QPA_PLATFORM=offscreen tsuki --help
          QT_QPA_PLATFORM=offscreen tsuki --smoke-test

          test -f /usr/share/applications/io.github.muzammilshafique.tsuki.desktop
          test -f /usr/share/metainfo/io.github.muzammilshafique.tsuki.metainfo.xml
          test -f /usr/share/icons/hicolor/scalable/apps/io.github.muzammilshafique.tsuki.svg
          test -f /usr/lib/udev/rules.d/70-tsuki-uinput.rules
          test -f /usr/lib/modules-load.d/tsuki-uinput.conf
          test -f /usr/share/licenses/tsuki/LICENSE

          dnf remove -y tsuki
          hash -r
          if [[ -e /usr/bin/tsuki ]] || command -v tsuki >/dev/null 2>&1; then
            echo "Error: tsuki binary still exists after package removal!" >&2
            exit 1
          fi

      - name: Upload Fedora RPM Package
        uses: actions/upload-artifact@v7
        with:
          name: rpm-package
          path: dist/*.rpm
          if-no-files-found: error

  package-appimage:
    name: Package AppImage (.AppImage)
    runs-on: ubuntu-latest
    container:
      image: ubuntu:22.04
    steps:
      - name: Prepare Ubuntu 22.04 container and install build dependencies
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl git python3 python3-pip p7zip-full file \
            desktop-file-utils g++ pkg-config \
            libsdl2-dev zlib1g-dev \
            libgl1 libegl1 libgl-dev libegl-dev libopengl-dev libvulkan-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libfontconfig1 libfreetype6 libdbus-1-3 libxrender1 libxi6 libsm6 libice6 \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-xinerama0 libx11-xcb1 \
            libssl3 libsqlite3-0 hicolor-icon-theme tar
          python3 -m pip install --no-cache-dir --upgrade pip
          python3 -m pip install --no-cache-dir aqtinstall cmake ninja
          python3 -m aqt install-qt --outputdir /opt/qt linux desktop 6.8.3 linux_gcc_64 -m qtshadertools qtimageformats
          git config --system --add safe.directory '*'

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Determine Version
        id: vars
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="${{ github.event.inputs.tag || 'v0.1.1' }}"
          fi
          RAW_VERSION="${TAG#v}"
          echo "raw_version=${RAW_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build AppImage
        env:
          VERSION: ${{ steps.vars.outputs.raw_version }}
          QT_DIR: /opt/qt/6.8.3/gcc_64
        run: ./packaging/appimage/build-appimage.sh "${GITHUB_WORKSPACE}/dist"

      - name: Verify AppImage Execution
        run: |
          APPIMAGE_FILE=$(find dist -maxdepth 1 -name "*.AppImage" | head -n 1)
          test -n "${APPIMAGE_FILE}"
          ls -lh "${APPIMAGE_FILE}"
          TEST_HOME="$(mktemp -d)"
          trap 'rm -rf "${TEST_HOME}"' EXIT
          mkdir -p "${TEST_HOME}/.config" "${TEST_HOME}/.local/share" "${TEST_HOME}/.cache"
          HOME="${TEST_HOME}" \
          XDG_CONFIG_HOME="${TEST_HOME}/.config" \
          XDG_DATA_HOME="${TEST_HOME}/.local/share" \
          XDG_CACHE_HOME="${TEST_HOME}/.cache" \
          APPIMAGE_EXTRACT_AND_RUN=1 \
          QT_QPA_PLATFORM=offscreen \
          "./${APPIMAGE_FILE}" --version
          HOME="${TEST_HOME}" \
          XDG_CONFIG_HOME="${TEST_HOME}/.config" \
          XDG_DATA_HOME="${TEST_HOME}/.local/share" \
          XDG_CACHE_HOME="${TEST_HOME}/.cache" \
          APPIMAGE_EXTRACT_AND_RUN=1 \
          QT_QPA_PLATFORM=offscreen \
          "./${APPIMAGE_FILE}" --help
          HOME="${TEST_HOME}" \
          XDG_CONFIG_HOME="${TEST_HOME}/.config" \
          XDG_DATA_HOME="${TEST_HOME}/.local/share" \
          XDG_CACHE_HOME="${TEST_HOME}/.cache" \
          APPIMAGE_EXTRACT_AND_RUN=1 \
          QT_QPA_PLATFORM=offscreen \
          "./${APPIMAGE_FILE}" --smoke-test

      - name: Upload AppImage Artifact
        uses: actions/upload-artifact@v7
        with:
          name: appimage-package
          path: dist/*.AppImage
          if-no-files-found: error

  release:
    name: GitHub Release & Artifacts
    needs:
      - package-arch
      - package-deb
      - package-rpm
      - package-appimage
    runs-on: ubuntu-latest
    steps:
      - name: Download Arch package artifact
        uses: actions/download-artifact@v8
        with:
          name: arch-package
          path: release-artifacts

      - name: Download Debian / Ubuntu package artifact
        uses: actions/download-artifact@v8
        with:
          name: deb-package
          path: release-artifacts

      - name: Download Fedora RPM package artifact
        uses: actions/download-artifact@v8
        with:
          name: rpm-package
          path: release-artifacts

      - name: Download AppImage artifact
        uses: actions/download-artifact@v8
        with:
          name: appimage-package
          path: release-artifacts

      - name: Cross-verify .deb and .AppImage on Ubuntu runner
        run: |
          DEB_FILE=$(find release-artifacts -maxdepth 1 -name "*.deb" | head -n 1)
          APPIMAGE_FILE=$(find release-artifacts -maxdepth 1 -name "*.AppImage" | head -n 1)
          test -n "${DEB_FILE}"
          test -n "${APPIMAGE_FILE}"

          sudo apt-get update
          sudo apt-get install -y "./${DEB_FILE}"
          QT_QPA_PLATFORM=offscreen tsuki --version
          QT_QPA_PLATFORM=offscreen tsuki --smoke-test
          sudo apt-get purge -y tsuki

          chmod +x "${APPIMAGE_FILE}"
          APPIMAGE_EXTRACT_AND_RUN=1 QT_QPA_PLATFORM=offscreen "./${APPIMAGE_FILE}" --version
          APPIMAGE_EXTRACT_AND_RUN=1 QT_QPA_PLATFORM=offscreen "./${APPIMAGE_FILE}" --smoke-test

      - name: Verify All Packages & Generate Checksums
        id: pkgs
        run: |
          ls -la release-artifacts/
          ARCH_PKG=$(find release-artifacts -maxdepth 1 -name "*.pkg.tar.zst" -printf "%f\n" | head -n 1)
          DEB_PKG=$(find release-artifacts -maxdepth 1 -name "*.deb" -printf "%f\n" | head -n 1)
          RPM_PKG=$(find release-artifacts -maxdepth 1 -name "*.rpm" -printf "%f\n" | head -n 1)
          APPIMAGE_PKG=$(find release-artifacts -maxdepth 1 -name "*.AppImage" -printf "%f\n" | head -n 1)

          if [[ -z "${ARCH_PKG}" || -z "${DEB_PKG}" || -z "${RPM_PKG}" || -z "${APPIMAGE_PKG}" ]]; then
            echo "::error::Missing required release package(s)! arch=${ARCH_PKG:-none} deb=${DEB_PKG:-none} rpm=${RPM_PKG:-none} appimage=${APPIMAGE_PKG:-none}"
            exit 1
          fi

          echo "arch_pkg=${ARCH_PKG}" >> "$GITHUB_OUTPUT"
          echo "deb_pkg=${DEB_PKG}" >> "$GITHUB_OUTPUT"
          echo "rpm_pkg=${RPM_PKG}" >> "$GITHUB_OUTPUT"
          echo "appimage_pkg=${APPIMAGE_PKG}" >> "$GITHUB_OUTPUT"

          cd release-artifacts
          sha256sum *.pkg.tar.zst *.deb *.rpm *.AppImage > SHA256SUMS
          echo "Generated SHA256SUMS:"
          cat SHA256SUMS

      - name: Generate Release Notes
        run: |
          cat << 'EOF' > RELEASE_NOTES.md
          ## Tsuki ${{ needs.package-arch.outputs.tag }}

          Native Linux Game Launcher for Wine, Proton, and native titles.

          ### Installation

          #### Universal Linux (`.AppImage`)
          Works on most modern Linux distributions (including Ubuntu 22.04+, Debian 12+, Fedora, Arch, and SteamOS):
          ```bash
          chmod +x ./${{ steps.pkgs.outputs.appimage_pkg }}
          ./${{ steps.pkgs.outputs.appimage_pkg }}
          ```

          #### Arch Linux
          - **Direct Pacman Package (`.pkg.tar.zst`)**:
            ```bash
            sudo pacman -U ./${{ steps.pkgs.outputs.arch_pkg }}
            ```
          - **AUR**:
            - Prebuilt binary: `yay -S tsuki-bin` or `paru -S tsuki-bin`
            - Latest git: `yay -S tsuki-git` or `paru -S tsuki-git`

          #### Ubuntu / Debian (`.deb` — Ubuntu 25.10+ / 26.04 LTS & Debian 13+)
          ```bash
          sudo apt install ./${{ steps.pkgs.outputs.deb_pkg }}
          ```

          #### Fedora (`.rpm`)
          ```bash
          sudo dnf install ./${{ steps.pkgs.outputs.rpm_pkg }}
          ```

          ### Controller Emulation (`/dev/uinput`)

          The `.pkg.tar.zst`, `.deb`, and `.rpm` packages automatically install `/usr/lib/udev/rules.d/70-tsuki-uinput.rules` and `/usr/lib/modules-load.d/tsuki-uinput.conf` to grant active desktop session users access to `/dev/uinput` for virtual Xbox 360 controller emulation via systemd `uaccess` without root privileges. (AppImage users can copy those files from `packaging/udev/` if `/dev/uinput` is not already writable.)

          ### Integrity Checksums (SHA-256)
          ```
          EOF
          cat release-artifacts/SHA256SUMS >> RELEASE_NOTES.md
          cat << 'EOF' >> RELEASE_NOTES.md
          ```
          EOF

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.package-arch.outputs.tag }}
          name: Tsuki ${{ needs.package-arch.outputs.tag }}
          body_path: RELEASE_NOTES.md
          files: |
            release-artifacts/*.pkg.tar.zst
            release-artifacts/*.deb
            release-artifacts/*.rpm
            release-artifacts/*.AppImage
            release-artifacts/SHA256SUMS
          fail_on_unmatched_files: true
          draft: false
          prerelease: false

  publish-aur:
    name: Publish to AUR (tsuki-bin & tsuki-git)
    needs:
      - package-arch
      - release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    steps:
      - name: Check AUR SSH secret configuration
        id: auth_check
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          if [[ -z "${AUR_SSH_PRIVATE_KEY}" ]]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::AUR_SSH_PRIVATE_KEY is not configured; skipping AUR publish."
            echo "AUR publish skipped because \`AUR_SSH_PRIVATE_KEY\` secret is not configured." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install git, OpenSSH, and curl
        if: steps.auth_check.outputs.enabled == 'true'
        run: |
          sed -i 's/^#DisableSandbox/DisableSandbox/' /etc/pacman.conf
          pacman -Sy --noconfirm archlinux-keyring
          pacman -Syu --noconfirm git openssh curl
          git config --system --add safe.directory '*'

      - name: Checkout repository
        if: steps.auth_check.outputs.enabled == 'true'
        uses: actions/checkout@v7

      - name: Setup Non-Root Build User
        if: steps.auth_check.outputs.enabled == 'true'
        run: useradd -m -s /bin/bash builduser

      - name: Download AUR tsuki-bin artifact
        if: steps.auth_check.outputs.enabled == 'true'
        uses: actions/download-artifact@v8
        with:
          name: aur-tsuki-bin
          path: aur-tsuki-bin

      - name: Download AUR tsuki-git artifact
        if: steps.auth_check.outputs.enabled == 'true'
        uses: actions/download-artifact@v8
        with:
          name: aur-tsuki-git
          path: aur-tsuki-git

      - name: Verify published GitHub Release asset for tsuki-bin
        if: steps.auth_check.outputs.enabled == 'true'
        run: |
          ASSET_URL=$(awk -F' = ' '/^\tsource_x86_64 = /{print $2; exit}' aur-tsuki-bin/.SRCINFO | sed 's/^[^:]*:://')
          EXPECTED_SHA=$(awk -F' = ' '/^\tsha256sums_x86_64 = /{print $2; exit}' aur-tsuki-bin/.SRCINFO)
          test -n "${ASSET_URL}"
          test -n "${EXPECTED_SHA}"

          TMP_ASSET=$(mktemp)
          trap 'rm -f "${TMP_ASSET}"' EXIT
          curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors "${ASSET_URL}" -o "${TMP_ASSET}"
          ACTUAL_SHA=$(sha256sum "${TMP_ASSET}" | awk '{print $1}')
          if [[ "${ACTUAL_SHA}" != "${EXPECTED_SHA}" ]]; then
            echo "::error::Release asset checksum mismatch: expected ${EXPECTED_SHA}, got ${ACTUAL_SHA}"
            exit 1
          fi
          echo "Verified live release asset ${ASSET_URL} (sha256=${ACTUAL_SHA})"

      - name: Configure AUR SSH authentication
        if: steps.auth_check.outputs.enabled == 'true'
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          mkdir -p /root/.ssh
          chmod 700 /root/.ssh

          clean_key="${AUR_SSH_PRIVATE_KEY//$'\r'/}"
          printf '%s\n' "${clean_key%$'\n'}" > /root/.ssh/aur
          chmod 600 /root/.ssh/aur

          # Official aur.archlinux.org SSH host public keys
          cat << 'EOF' > /root/.ssh/known_hosts
          aur.archlinux.org ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEuBKrPzbawxA/k2g6NcyV5jmqwJ2s+zpgZGZ7tpLIcN
          aur.archlinux.org ecdsa-sha2-nistp256 AAAAE2VjZHNhLXNoYTItbmlzdHAyNTYAAAAIbmlzdHAyNTYAAABBBLMiLrP8pVi5BFX2i3vepSUnpedeiewE5XptnUnau+ZoeUOPkpoCgZZuYfpaIQfhhJJI5qgnjJmr4hyJbe/zxow=
          aur.archlinux.org ssh-rsa 
          EOF
          chmod 644 /root/.ssh/known_hosts

      - name: Publish tsuki-bin and tsuki-git to AUR
        if: steps.auth_check.outputs.enabled == 'true'
        env:
          GIT_SSH_COMMAND: ssh -F /dev/null -i /root/.ssh/aur -o IdentitiesOnly=yes -o BatchMode=yes -o UserKnownHostsFile=/root/.ssh/known_hosts -o GlobalKnownHostsFile=/dev/null -o StrictHostKeyChecking=yes
          AUR_GIT_NAME: ${{ vars.AUR_GIT_NAME || 'Muzammil Shafique' }}
          AUR_GIT_EMAIL: ${{ vars.AUR_GIT_EMAIL || 'muzu@duck.com' }}
        run: |
          chmod +x packaging/aur/publish.sh

          bin_status="failed"
          git_status="failed"
          rc=0

          if ./packaging/aur/publish.sh tsuki-bin aur-tsuki-bin; then
            bin_status="success"
          else
            rc=1
          fi

          if ./packaging/aur/publish.sh tsuki-git aur-tsuki-git; then
            git_status="success"
          else
            rc=1
          fi

          {
            echo "### AUR Publish Results (\`${{ needs.package-arch.outputs.tag }}\`)"
            echo ""
            echo "| Package | Status | Target Version |"
            echo "| --- | --- | --- |"
            echo "| \`tsuki-bin\` | ${bin_status} | \`${{ needs.package-arch.outputs.pkgver }}\` |"
            echo "| \`tsuki-git\` | ${git_status} | \`${{ needs.package-arch.outputs.git_pkgver }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

          exit "${rc}"

      - name: Clean up SSH credentials
        if: always()
        run: rm -rf /root/.ssh
